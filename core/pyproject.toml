[project]
name = "udl"
version = "0.6.1"
description = "整合下載器 unified Python core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "william563214" }]
dependencies = [
  "requests>=2.32.0",
  "beautifulsoup4>=4.12.0",
  "keyring>=25.0.0",
  "PySocks>=1.7.1",
]

[project.optional-dependencies]
dev = [
  "pyinstaller>=6.0.0",
  "ruff>=0.8.0",
]
iwara = [
  "cloudscraper>=1.2.71",
]

[project.scripts]
udl = "udl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["udl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
