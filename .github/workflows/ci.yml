name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync and lint Python
        working-directory: core
        run: |
          uv sync --extra dev
          uv run ruff check udl
          uv run udl sites
          uv run udl schema >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl history list --json --limit 1 >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl queue list --json --unfinished >/dev/null
          uv run udl naming preview --template '{site}/{author}/{title}.{ext}' --metadata '{"site":"iwara","author":"a","title":"t"}' --json >/dev/null
          UDL_CONFIG="$RUNNER_TEMP/udl-ci.config.json" uv run udl config show --json >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl repair scan --json --no-orphans >/dev/null
          UDL_CONFIG="$RUNNER_TEMP/udl-ci.config.json" uv run udl rules list --json >/dev/null
          uv run udl page --help >/dev/null
          uv run udl get --help >/dev/null
          uv run udl bili login status --json >/dev/null || true
          uv run udl bili login qr --json --no-image >/dev/null || true

  lint-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and typecheck frontend
        working-directory: app
        run: |
          npm ci
          npm run build
