name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Sync and lint Python
        working-directory: core
        run: |
          uv sync --extra dev --extra mcp
          uv run python ../scripts/make_lazy_extractors.py
          git diff --exit-code -- udl/extractors/lazy_extractors.py
          uv run ruff check udl
          uv run udl mcp --help >/dev/null
          uv run udl sites
          uv run udl gallerydl status --json >/dev/null || true
          uv run udl schema >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl history list --json --limit 1 >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl queue list --json --unfinished >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl queue schedule status --json >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl queue schedule list --json >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl queue schedule set ci-night --start 22:00 --end 06:00 --days weekdays --max-concurrent 2 --after none --json >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl queue schedule profile set ci-day --default-limit 1M --window 'weekdays:09:00-18:00:256K' --clear-windows --json >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl queue schedule quota --enable --hour-mb 100 --day-mb 1000 --json >/dev/null
          uv run udl naming preview --template '{site}/{author}/{title}.{ext}' --metadata '{"site":"iwara","author":"a","title":"t"}' --json >/dev/null
          UDL_CONFIG="$RUNNER_TEMP/udl-ci.config.json" uv run udl config show --json >/dev/null
          UDL_DB="$RUNNER_TEMP/udl-ci.sqlite3" uv run udl repair scan --json --no-orphans >/dev/null
          UDL_CONFIG="$RUNNER_TEMP/udl-ci.config.json" uv run udl rules list --json >/dev/null
          uv run udl zip-passwords list --json >/dev/null
          uv run udl page "https://example.com/" --json --no-head >/dev/null
          uv run udl resolve "https://example.com/" --json >/dev/null || true
          uv run udl bili login status --json >/dev/null || true
          uv run udl bili login qr --json --no-image >/dev/null || true

  lint-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install and typecheck frontend
        working-directory: app
        run: |
          npm ci
          npm run build
